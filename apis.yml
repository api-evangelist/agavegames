description: Agave Games is a mobile game publisher based in Istanbul, Turkey, founded in 2021 by Alper
  Oner, Burak Kar, and Ali Baran Terzioglu. The company specializes in casual puzzle games played by
  millions, with titles including Find the Cat, Wonder Link, What The Hex, Soda Match, and Art Block
  Puzzle across iOS and Android. Backed by Balderton Capital and Felix Capital (Series A, December 2024),
  Agave Games is a consumer-facing gaming company; it publishes no public developer portal, API, or
  documentation surface. This profile was surfaced as a Balderton Capital portfolio company and enriched
  with a live domain-security probe and identity hygiene.
